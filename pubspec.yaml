version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  provider: ^6.1.2                  # Untuk State Management
  http: ^1.2.1                      # Untuk REST API (Google Books)
  supabase_flutter: ^2.5.6          # Untuk Database Supabase
  google_fonts: ^6.2.1              # Untuk Font estetik (Playfair/Lora)
